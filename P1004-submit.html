<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>P1004 成长快乐</title>
<style>
    body{
        max-width: 800px;
        margin: 20px auto;
        padding: 0 15px; 
        font-family: sans-serif; 
        background: #f4f6f9; 
    }
    .card{ background: #fff; 
        padding: 25px; 
        border-radius: 15px; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
    }
    h1{text-align: center; 
        color: #2c3e50; 
        margin: 0 0 20px 0; 
    }
    textarea{width: 100%;
        height: 180px; 
        margin: 10px 0; 
        font-family: Consolas, monospace; 
        font-size: 16px;
        padding: 15px; 
        box-sizing: border-box; 
        border: 1px solid #ddd; 
        border-radius: 12px; 
        outline: none; 
    }
    textarea:focus{
        border-color: #007bff; 
    }
    button{ 
        padding: 15px 20px; 
        cursor: pointer; 
        background: #007bff; 
        color: white; 
        border: none; 
        border-radius: 12px; 
        transition: background 0.2s; 
        width: 100%; 
        font-size: 18px; 
        font-weight: bold; 
    }
    button:hover{ 
        background: #0056b3; 
    }
    button:disabled{ 
        cursor: not-allowed; 
        background: #6c757d; 
    }
    #result{ 
        margin-top: 20px; 
        padding: 15px; 
        white-space: pre-wrap; 
        font-family: Consolas, monospace; 
        display: none; 
        border-radius: 12px; 
        min-height: 100px; 
        font-size: 16px; 
    }
    .pass{ 
        background: #d4edda; 
        color: #155724; 
        border: 1px solid #c3e6cb; 
    }
    .fail{ 
        background: #f8d7da; 
        color: #721c24; 
        border: 1px solid #f5c6cb; 
    }
    .error{ 
        background: #fff3cd; 
        color: #856404; 
        border: 1px solid #ffeeba;
    }
    .case-area{
        display: none; 
    }
</style>
</head>
<body>
<h1>P1004 成长快乐</h1>
<div class="card">
<textarea id="code" placeholder="输入C++代码..."></textarea>
<div class="case-area">
<div class="row"><span>用例1:</span> <div class="case-value">输入：10,10,10,10,10,10,10,10,10,10,10...</div> <div class="case-value">预期输出：1694851393</div></div>
<div class="row"><span>用例2:</span> <div class="case-value">输入：10,100,100,100,100,100,100,100,100,100,100...</div> <div class="case-value">预期输出：1452729852</div></div>
</div>
<button id="runBtn" onclick="judge()">开始判题</button>
<div id="result"></div>
</div>

<script>
const API_URL = "https://wandbox.org/api/compile.json";
const FIXED_TEST_CASES = [
    { input: "3 2 10 0 0\n2\n2 4 0 0 0\n4 8 0 0 0", 
    expect: "2\n6\n2.000000 4.000000 0.000000 1\n4.000000 8.000000 0.000000 2"},
    { input: "1 2 10 0 0\n3\n3 3 0 0 0\n2 6 0 0 0\n4 9 0 0 0", 
    expect: "0\n0" },
    { input: "2 2 8 0 0\n2\n3 6 0 -1 0\n4 8 0 0 0", 
    expect: "2\n7\n2.000000 4.000000 0.000000 1\n5.000000 8.000000 0.000000 2" },
    { input: "2 1 10 0 0\n3\n3 3 4 0 0\n3 3 -4 0 0\n5 6 0 0 0", 
    expect: "2\n8\n5.000000 3.000000 4.000000 1\n8.162278 6.000000 0.000000 3" },
    { input: "1 3 5 0 0\n2\n2 4 0 -1 0\n3 7 0 -2 0", 
    expect: "2\n5\n1.000000 3.000000 0.000000 1\n2.500000 2.000000 0.000000 2" },
    { input: "1 1 20 0 0\n5\n1 2 0 0 0\n2 4 0 0 0\n3 6 0 0 0\n4 8 0 0 0\n5 10 0 0 0", 
    expect: "5\n15\n2.000000 2.000000 0.000000 1\n4.000000 4.000000 0.000000 2\n6.000000 6.000000 0.000000 3\n8.000000 8.000000 0.000000 4\n10.000000 10.000000 0.000000 5" },
    { input: "2 3 10 0 0\n3\n3 9 0 -2 0\n4 12 0 -3 0\n5 15 0 -4 0", 
    expect: "3\n12\n1.800000 5.400000 0.000000 1\n3.000000 3.000000 0.000000 2\n4.090909 1.636364 0.000000 3" },
    { input: "1 2 15 0 0\n4\n2 0 5 0 0\n2 5 0 0 0\n3 0 -5 0 0\n4 -5 0 0 0", 
    expect: "4\n11\n2.500000 5.000000 0.000000 2\n5.000000 0.000000 -5.000000 3\n6.250000 0.000000 5.000000 1\n8.750000 -5.000000 0.000000 4" },
    { input: "1 2 12 0 0\n5\n1 3 0 0 0\n2 5 0 1 0\n3 0 4 0 -1\n2 7 0 -1 0\n4 10 0 0 0", 
    expect: "4\n8\n1.500000 3.000000 0.000000 1\n2.000000 2.000000 2.000000 3\n3.500000 8.500000 0.000000 2\n5.500000 10.000000 0.000000 5" }
];
const OJ_STATUS = {
    AC: { code: "AC", name: "通过" }, WA: { code: "WA", name: "答案错误" },
    PAC: { code: "PAC", name: "部分通过" }, CE: { code: "CE", name: "编译错误" },
    RE: { code: "RE", name: "运行时错误" }, TLE: { code: "TLE", name: "超时" }
};
function normalizeText(text) { return (text || "").replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim(); }
async function executeCode(code, stdin) {
    const response = await fetch(API_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ compiler: "gcc-head", code: code, stdin: stdin, options: "-std=c++11" })
    });
    const data = await response.json();
    return { compile: { stderr: data.compiler_error || "" }, run: { stdout: data.program_output || "", stderr: data.program_error || "", code: data.status === "0" ? 0 : 1 } };
}
async function judge() {
    const runBtn = document.getElementById('runBtn'), resultBox = document.getElementById('result'), codeContent = document.getElementById('code').value.trim();
    if (!codeContent) { alert("请输入有效的C++代码"); return; }
    runBtn.disabled = true; runBtn.innerText = "判题中..."; resultBox.style.display = 'block'; resultBox.className = ''; resultBox.innerText = "正在执行代码...\n\n";
    let passCount = 0, logText = "【判题结果】\n\n", caseStatusList = [];
    for (let i = 0; i < FIXED_TEST_CASES.length; i++) {
        try {
            const { input, expect } = FIXED_TEST_CASES[i], result = await executeCode(codeContent, input + "\n");
            if (result.compile && result.compile.stderr) { logText += `用例${i+1}: [CE] 编译错误\n${result.compile.stderr}\n`; caseStatusList.push(OJ_STATUS.CE); resultBox.innerText = logText; continue; }
            const stdout = result.run?.stdout || "", stderr = result.run?.stderr || "", exitCode = result.run?.code || 0;
            if (stderr || exitCode !== 0) { logText += `用例${i+1}: [RE] 运行时错误\n${stderr}\n`; caseStatusList.push(OJ_STATUS.RE); resultBox.innerText = logText; continue; }
            const actualOutput = normalizeText(stdout), expectOutput = normalizeText(expect);
            let status;
            if (actualOutput === expectOutput) { status = OJ_STATUS.AC; passCount++; } else { status = OJ_STATUS.WA; }
            caseStatusList.push(status); logText += `用例${i+1}: [${status.code}] ${status.name}`;
             if (status.code === "WA") logText += `\n  输入: ${input}\n  输出: ${actualOutput || "(空)"}`;
            logText += "\n";
        } catch (error) { logText += `用例${i+1}: [RE] ${error.message}\n`; caseStatusList.push(OJ_STATUS.RE); }
        resultBox.innerText = logText;
    }
    const total = FIXED_TEST_CASES.length;
    if (passCount === total) { logText += `\n[AC] 通过\n`; resultBox.className = 'pass'; }
    else if (passCount > 0) { logText += `\n[PAC] 部分通过\n`; resultBox.className = 'error'; }
    else { logText += `\n[WA] 答案错误\n`; resultBox.className = 'fail'; }
    logText += `\n📊 判题总结: ${passCount}/${total} 个用例通过`; resultBox.innerText = logText;
    runBtn.disabled = false; runBtn.innerText = "开始判题";
}
</script>
</body>
</html>
