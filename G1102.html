        <h2>题目背景：</h2>
        <h3>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            金字塔由 n 层石块垒成。从塔底向上，每层依次需要 n×n,
            (n−1)×(n−1),⋯,2×2,1×1 块石块。请问搭建金字塔总共需要多少块石块？
        </h3>
        <h2>题目数值：</h2>
        <h3>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            一个正整数n表示金字塔的层数，一个正整数m表示一共有多少个石块。
        </h3>
        <h2>输入格式：</h2>
        <h3>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
           一行，输入n。
        </h3>
        <h2>输出格式：</h2>
        <h3>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            一行，输出m。
        </h3>
        <h2>数据范围：</h2>
        <h3>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            对于%100的数据：0&le;n&le;50
        </h3>
        <h2>数据样例:</h2>
    </div>
