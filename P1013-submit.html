<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>P1013 sin</title>
<style>
    body{
        max-width:800px;
        margin:20px auto;
        padding:0 15px;
        font-family:sans-serif;
        background:#f4f6f9
    }
    .card{
        background:#fff;
        padding:25px;
        border-radius:15px;
        box-shadow:0 5px 15px rgba(0,0,0,0.05)
    }
    h1{
        text-align:center;
        color:#2c3e50;
        margin:0 0 5px 0
    }
    .problem-info{
        text-align:center;
        color:#6c757d;
        font-size:14px;
        margin-bottom:20px
    }
    textarea{
        width:100%;
        height:180px;
        margin:10px 0;
        font-family:Consolas,monospace;
        font-size:16px;
        padding:15px;
        box-sizing:border-box;
        border:1px solid #ddd;
        border-radius:12px;
        outline:none
    }
    textarea:focus{
        border-color:#007bff
    }
    button{
        padding:15px 20px;
        cursor:pointer;
        background:#007bff;
        color:white;
        border:none;
        border-radius:12px;
        transition:background 0.2s;
        width:100%;
        font-size:18px;
        font-weight:bold
    }
    button:hover{
        background:#0056b3
    }
    button:disabled{
        cursor:not-allowed;
        background:#6c757d
    }
    #result{
        margin-top:20px;
        padding:15px;
        white-space:pre-wrap;
        font-family:Consolas,monospace;
        display:none;
        border-radius:12px;
        min-height:100px;
        font-size:16px
    }
    .pass{
        background:#d4edda;
        color:#155724;
        border:1px solid #c3e6cb
    }
    .fail{
        background:#f8d7da;
        color:#721c24;
        border:1px solid #f5c6cb
        }
    .error{
        background:#fff3cd;
        color:#856404;
        border:1px solid #ffeeba
    }
</style>
</head>
<body>
<h1>P1013 sin</h1>
<div class="card">
<textarea id="code" placeholder="输入C++代码..."></textarea>
<button id="runBtn" onclick="judge()">开始判题</button>
<div id="result"></div>
</div>

<script>
const API_URL = "https://wandbox.org/api/compile.json";
const FIXED_TEST_CASES =[
    { input: "30", expect: "0.500000"},
    { input: "45", expect: "0.707110"},
    { input: "-30", expect: "-0.500000"},
    { input: "390", expect: "0.500000"},
    { input: "36.5", expect: "0.594820"}
];
const OJ_STATUS = {
    AC: { code: "AC", name: "通过" },
    WA: { code: "WA", name: "答案错误" },
    PAC: { code: "PAC", name: "部分通过" },
    CE: { code: "CE", name: "编译错误" },
    RE: { code: "RE", name: "运行时错误" },
    TLE: { code: "TLE", name: "超时" }
};

function normalizeText(text) {
    return (text || "").replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
}

async function executeCode(code, stdin) {
    const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            compiler: "gcc-head",
            code: code,
            stdin: stdin,
            options: "-std=c++11"
        })
    });
    const data = await response.json();
    return {
        compile: { stderr: data.compiler_error || "" },
        run: {
            stdout: data.program_output || "",
            stderr: data.program_error || "",
            code: data.status === "0" ? 0 : 1
        }
    };
}

async function judge() {
    const runBtn = document.getElementById('runBtn');
    const resultBox = document.getElementById('result');
    const codeContent = document.getElementById('code').value.trim();
    if (!codeContent) { alert("请输入有效的C++代码"); return; }
    runBtn.disabled = true; runBtn.innerText = "判题中...";
    resultBox.style.display = 'block'; resultBox.className = ''; resultBox.innerText = "正在执行代码...\n\n";
    let passCount = 0, logText = "【判题结果】\n\n", caseStatusList = [];
    for (let i = 0; i < FIXED_TEST_CASES.length; i++) {
        try {
            const { input, expect } = FIXED_TEST_CASES[i];
            const result = await executeCode(codeContent, input + "\n");
            if (result.compile && result.compile.stderr) {
                logText += `用例${i+1}: [CE] 编译错误\n${result.compile.stderr}\n`;
                caseStatusList.push(OJ_STATUS.CE); resultBox.innerText = logText; continue;
            }
            const stdout = result.run?.stdout || "", stderr = result.run?.stderr || "", exitCode = result.run?.code || 0;
            if (stderr || exitCode !== 0) {
                logText += `用例${i+1}: [RE] 运行时错误\n${stderr}\n`;
                caseStatusList.push(OJ_STATUS.RE); resultBox.innerText = logText; continue;
            }
            const actualOutput = normalizeText(stdout), expectOutput = normalizeText(expect);
            let status;
            if (actualOutput === expectOutput) { status = OJ_STATUS.AC; passCount++; }
            else { status = OJ_STATUS.WA; }
            caseStatusList.push(status);
            logText += `用例${i+1}: [${status.code}] ${status.name}`;
            if (status.code === "WA") logText += `\n  输入: ${input}\n  输出: ${actualOutput || "(空)"}`;
            logText += "\n";
        } catch (error) {
            logText += `用例${i+1}: [RE] ${error.message}\n`;
            caseStatusList.push(OJ_STATUS.RE);
        }
        resultBox.innerText = logText;
    }
    const total = FIXED_TEST_CASES.length;
    if (passCount === total) { logText += `\n[AC] 通过\n`; resultBox.className = 'pass'; }
    else if (passCount > 0) { logText += `\n[PAC] 部分通过\n`; resultBox.className = 'error'; }
    else { logText += `\n[WA] 答案错误\n`; resultBox.className = 'fail'; }
    logText += `\n📊 判题总结: ${passCount}/${total} 个用例通过`;
    resultBox.innerText = logText;
    runBtn.disabled = false; runBtn.innerText = "开始判题";
}
</script>
</body>
</html>
