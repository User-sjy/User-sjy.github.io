<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    .rumen{
        border: 2px solid #fa3a3a;
        background-color: #f75a5a;
        width: 60px;
        height: 35px;
        color: white;
        line-height: 35px; 
        text-align: center;
        font-size: 15px;
        border-radius: 5px;
    }
    .puji{
        border: 2px solid #fc7c33;
        background-color: #f8934f;
        width: 60px;
        height: 35px;
        color: white;
        line-height: 35px; 
        text-align: center;
        font-size: 15px;
        border-radius: 5px;
    }
    .zhongdeng{
        border: 2px solid #fcc633;
        background-color: #f8df4f;
        width: 60px;
        height: 35px;
        color: white;
        line-height: 35px; 
        text-align: center;
        font-size: 15px;
        border-radius: 5px;
    }
    .jiaonan{
        border: 2px solid #27fcaa;
        background-color: #4ff8b2;
        width: 60px;
        height: 35px;
        color: white;
        line-height: 35px; 
        text-align: center;
        font-size: 15px;
        border-radius: 5px;
    }
    .tigao{
        border: 2px solid #33bcfc;
        background-color: #4fc3f8;
        width: 60px;
        height: 35px;
        color: white;
        line-height: 35px; 
        text-align: center;
        font-size: 15px;
        border-radius: 5px;
    }
    .jinan{
        border: 2px solid #3336fc;
        background-color: #524ff8;
        width: 60px;
        height: 35px;
        color: white;
        line-height: 35px; 
        text-align: center;
        font-size: 15px;
        border-radius: 5px;
    }
    .NOI{
        border: 2px solid #8033fc83;
        background-color: #824ff8;
        width: 60px;
        height: 35px;
        color: white;
        line-height: 35px; 
        text-align: center;
        font-size: 15px;
        border-radius: 5px;
    }
</style>
</head>
<body>
<span style="color: #3f3c3c;">
    <h1>难度评定</h1>
    <h3>DI值全称difficultly is，缩写为DI，DI值为1~600之间。</h3>
    <h3>DI值1~10为入门-：</h3>
    <span class="rumen" style="display: block;">入门-</span>
    <h3>DI值11~40为入门：</h3>
    <span class="rumen" style="display: block;">入门</span>
    <h3>DI值41~50为入门+：</h3>
    <span class="rumen" style="display: block;">入门+</span>
    <h3>DI值51~60为普及-：</h3>
    <span class="puji" style="display: block;">普及-</span>
    <h3>DI值61~90为普及：</h3>
    <span class="puji" style="display: block;">普及</span>
    <h3>DI值91~100为普及+：</h3>
    <span class="puji" style="display: block;">普及+</span>
    <h3>DI值101~200为中等：</h3>
    <span class="zhongdeng" style="display: block;">中等</span>
    <h3>DI值201~300为较难：</h3>
    <span class="jiaonan" style="display: block;">较难</span>
    <h3>DI值301~400</h3>
    <span class="tigao" style="display: block;">提高</span>
    <h3>DI值401~500为极难：</h3>
    <span class="jinan" style="display: block;">极难</span>
    <h3>DI值501~600为NOI：</h3>
    <span class="NOI" style="display: block;">NOI</span>
</span>
</body>
</html>
